name: check-secrets
on:
  push:
    branches: [main, migrate-spire-temp]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fichiers .env reels interdits
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.local|\.prod|\.production)?$'; then
            echo "::error::Fichier .env versionne"; exit 1; fi
      - name: Donnees strictement personnelles interdites partout
        run: |
          # CIN, etat civil hors LEGAL_IDENTITY, date de naissance, cles API Google/OpenAI
          P='BK71155|05/04/1970|1970-04-05|AIza[0-9A-Za-z_-]{30,}|sk-[A-Za-z0-9]{20,}'
          if git ls-files -z | xargs -0 grep -nIE "$P" -- ; then
            echo "::error::Donnee personnelle ou cle API detectee"; exit 1; fi
          echo "OK"
      - name: Coordonnees bancaires autorisees UNIQUEMENT dans src/data/servicesData.ts
        run: |
          P='MA[0-9]{2}[ ]?[0-9]{4}[ ]?[0-9]{4}[ ]?[0-9]{4}|4704161211026600|230[ ]?610[ ]?4704'
          if git ls-files -z | grep -zv '^src/data/servicesData.ts$' | xargs -0 grep -nIE "$P" -- ; then
            echo "::error::RIB/IBAN en dur hors de LEGAL_IDENTITY.bank"; exit 1; fi
          echo "OK - source unique respectee"